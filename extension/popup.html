<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Fixed Background Layer with World Map & Pulse Dots -->
  <div class="bg-layer">
    <div class="world-map"></div>
    <div class="ambient-glow"></div>
    <div class="pdot" style="top: 25%; left: 20%;"></div>
    <div class="pdot" style="top: 65%; left: 78%;"></div>
    <div class="pdot" style="top: 45%; left: 50%;"></div>
  </div>

  <!-- Animated Laser Scanning Line -->
  <div class="laser-bar" id="laserBar"></div>

  <!-- Main Glassmorphic Panel -->
  <div class="panel">
    <!-- Header with Shield Logo, Title & Pulse Status -->
    <header class="pg-header">
      <div class="logo-box">
        <svg class="shield-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
      <div class="logo-text">
        <div class="logo-main">PHISH<span class="logo-accent">SHIELD</span></div>
        <div class="logo-sub">THREAT DEFENSE V1.2</div>
      </div>
      <div class="status-dot" id="statusDot" title="Protection Active"></div>
    </header>

    <!-- Tip Bar -->
    <div class="tip-bar" id="tipBar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span id="currentUrlDisplay">Click Scan to verify active browser tab with ML models.</span>
    </div>

    <!-- Scan Button -->
    <button class="scan-btn" id="scanBtn">
      <span class="scan-btn-shine"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
        <path d="M16 21h5v-5"></path>
      </svg>
      <span id="scanBtnText">SCAN ACTIVE TAB</span>
    </button>

    <!-- Loading Box with Spinner & Streaming Logs -->
    <div class="loading-box hidden" id="loadingBox">
      <div class="spinner-ring"></div>
      <div class="log-lines">
        <div class="log-line visible" id="log1">Extracting tab URL...</div>
        <div class="log-line" id="log2">Resolving domain heuristics...</div>
        <div class="log-line" id="log3">Evaluating lexical entropy...</div>
        <div class="log-line" id="log4">Running ML classifier...</div>
      </div>
    </div>

    <!-- Result Card -->
    <div class="result-card hidden" id="resultCard">
      <div class="result-verdict">
        <div class="verdict-icon" id="verdictIcon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="verdict-label" id="verdictLabel">SAFE</div>
      </div>

      <div class="result-rows">
        <div class="result-row">
          <span class="rk">Domain</span>
          <span class="rv" id="resDomain">-</span>
        </div>
        <div class="result-row">
          <span class="rk">SSL Status</span>
          <span class="rv" id="resSsl">-</span>
        </div>
        <div class="result-row">
          <span class="rk">Threat Level</span>
          <span class="rv" id="resRisk">-</span>
        </div>
      </div>

      <div class="score-bar-wrap">
        <div class="score-bar-label">
          <span>Risk Probability</span>
          <span id="resScore">0%</span>
        </div>
        <div class="score-bar-track">
          <div class="score-bar-fill" id="scoreBarFill" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Strip -->
  <footer class="pg-footer">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <span>POWERED BY PHISHGUARD THREAT ENGINE</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
